<head>
<meta charset="UTF-8">

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  background: #f5f7f4;
  color: #20332d;
  line-height: 1.6;
}
header {
  background: #176b57;
  color: white;
  padding: 22px 16px;
}
header h1 {
  margin: 0;
  font-size: 28px;
}
header p {
  margin: 6px 0 0;
}
main {
  max-width: 1100px;
  margin: auto;
  padding: 18px;
}
.panel {
  background: white;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 18px;
  box-shadow: 0 3px 14px #173d2d0d;
}
h2 {
  margin-top: 0;
}
.filters {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
input, select, button {
  width: 100%;
  min-height: 44px;
  padding: 10px;
  border-radius: 9px;
  border: 1px solid #d6dfd9;
  font: inherit;
}
button {
  border: 0;
  background: #176b57;
  color: white;
  cursor: pointer;
}
button.secondary {
  background: #e4eee8;
  color: #176b57;
}
.actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
.actions button {
  flex: 1;
}
#results {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.card {
  background: white;
  border-radius: 13px;
  overflow: hidden;
  box-shadow: 0 3px 14px #173d2d0d;
}
.card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  display: block;
}
.card-content {
  padding: 12px;
}
.card h3 {
  margin: 0 0 6px;
}
.card p {
  font-size: 14px;
  margin: 5px 0;
}
.card button {
  margin-top: 8px;
}
#map {
  height: 320px;
  border-radius: 12px;
  background: #e4eee8;
}
footer {
  text-align: center;
  color: #63746b;
  padding: 24px 12px;
  font-size: 13px;
}
@media (max-width: 600px) {
  #results {
    grid-template-columns: 1fr;
  }
  .card img {
    height: 210px;
  }
  .filters {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<script>
const $ = (id) => document.getElementById(id);

const searchInput = $("search");
const monthSelect = $("month");
const regionSelect = $("region");
const budgetSelect = $("budget");
const themeSelect = $("theme");
const resultsBox = $("results");
const countBox = $("count");

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function getFilteredPlaces() {
  const search = searchInput.value.trim().toLowerCase();
  const month = monthSelect.value;
  const region = regionSelect.value;
  const budget = budgetSelect.value;
  const theme = themeSelect.value;

  return places.filter((place) => {
    const text = [
      place.name,
      place.country,
      place.region,
      place.theme,
      place.desc
    ].join(" ").toLowerCase();

    return (
      (!search || text.includes(search)) &&
      (!month || place.month.includes(Number(month))) &&
      (!region || place.region === region) &&
      (!budget || place.budget === budget) &&
      (!theme || place.theme === theme)
    );
  });
}

function renderCards() {
  const list = getFilteredPlaces();

  countBox.textContent = "找到 " + list.length + " 个目的地";

  if (list.length === 0) {
    resultsBox.innerHTML =
      "<p>没有找到符合条件的目的地，请调整筛选条件。</p>";
    return;
  }

  resultsBox.innerHTML = list.map((place) => `
    <article class="card">
      <img
        src="${escapeHTML(place.image)}"
        alt="${escapeHTML(place.name)}"
        loading="lazy"
        onerror="this.alt='图片暂时无法加载';this.style.height='40px'"
      >
      <div class="card-content">
        <h3>${escapeHTML(place.name)}</h3>
        <p>${escapeHTML(place.country)} · ${escapeHTML(place.region)}</p>
        <p>${escapeHTML(place.desc)}</p>
        <p>主题：${escapeHTML(place.theme)}</p>
        <p>预算：${escapeHTML(place.budget)}</p>
                <p>适合月份：${place.month.join("、")} 月</p>
        <button type="button"
          onclick="showPlaceDetail('${escapeHTML(place.name)}')">
          查看详情
        </button>
        <button type="button"
          onclick="toggleFavorite('${escapeHTML(place.name)}')">
          收藏这个目的地
        </button>
      </div>
    </article>
  `).join("");
}


  function showPlaceDetail(name) {
  const place = places.find((item) => item.name === name);

  if (!place) {
    alert("暂时找不到这个目的地。");
    return;
  }

  let dialog = document.getElementById("place-detail-dialog");

  if (!dialog) {
    dialog = document.createElement("dialog");
    dialog.id = "place-detail-dialog";
    dialog.style.cssText =
      "width:90%;max-width:520px;border:0;border-radius:14px;padding:20px;color:#20332d;";

    document.body.appendChild(dialog);
  }

  dialog.innerHTML = `
    <h2>${escapeHTML(place.name)} · 目的地详情</h2>
    <p><strong>国家或地区：</strong>${escapeHTML(place.country)}</p>
    <p><strong>所属洲：</strong>${escapeHTML(place.region)}</p>
    <p><strong>目的地介绍：</strong>${escapeHTML(place.desc)}</p>
    <p><strong>旅行主题：</strong>${escapeHTML(place.theme)}</p>
    <p><strong>预算等级：</strong>${escapeHTML(place.budget)}</p>
    <p><strong>适合月份：</strong>${place.month.join("、")} 月</p>
    <button type="button" id="close-place-detail">关闭详情</button>
  `;

  dialog.querySelector("#close-place-detail").addEventListener(
    "click",
    () => dialog.close()
  );

  if (!dialog.open) {
    dialog.showModal();
  }
    }
  function resetFilters() {
  searchInput.value = "";
  monthSelect.value = "";
  regionSelect.value = "";
  budgetSelect.value = "";
  themeSelect.value = "";
  renderCards();
}

[
  searchInput,
  monthSelect,
  regionSelect,
  budgetSelect,
  themeSelect
].forEach((element) => {
  element.addEventListener("input", renderCards);
  element.addEventListener("change", renderCards);
});

$("reset").addEventListener("click", resetFilters);

$("random").addEventListener("click", () => {
  const list = getFilteredPlaces();

  if (list.length === 0) {
    alert("没有可推荐的目的地，请调整筛选条件。");
    return;
  }

  const place = list[Math.floor(Math.random() * list.length)];
  alert(
    "今日推荐：" + place.name + "（" + place.country + "）\n\n" +
    place.desc + "\n\n适合月份：" +
    place.month.join("、") + " 月"
  );
});

renderCards();
</script>
<!-- PART 3 END -->

<script>
let favorites = [];

try {
  const savedFavorites = localStorage.getItem("yuexing-favorites");
  favorites = savedFavorites ? JSON.parse(savedFavorites) : [];

  if (!Array.isArray(favorites)) {
    favorites = [];
  }
} catch (error) {
  favorites = [];
}

const favoritesBox = document.getElementById("favorites");

function saveFavorites() {
  try {
    localStorage.setItem(
      "yuexing-favorites",
      JSON.stringify(favorites)
    );
  } catch (error) {
    alert("浏览器无法保存收藏，请检查浏览器设置。");
  }
}

function renderFavorites() {
  const savedPlaces = places.filter((place) =>
    favorites.includes(place.name)
  );

  if (savedPlaces.length === 0) {
    favoritesBox.textContent = "暂时还没有收藏。";
    return;
  }

  favoritesBox.innerHTML = savedPlaces.map((place) => `
    <div style="padding:10px 0;border-bottom:1px solid #e4eee8">
      <strong>${escapeHTML(place.name)}</strong>
      <span>（${escapeHTML(place.country)}）</span>
      <button
        type="button"
        class="secondary"
        style="margin-top:6px"
        onclick="toggleFavorite('${escapeHTML(place.name)}')">
        取消收藏
      </button>
    </div>
  `).join("");
}

function toggleFavorite(name) {
  if (favorites.includes(name)) {
    favorites = favorites.filter((item) => item !== name);
  } else {
    favorites.push(name);
  }

  saveFavorites();
  renderFavorites();
  renderCards();
}

renderFavorites();
</script>
<!-- PART 4 END -->

<script>
const mapElement = document.getElementById("map");
let travelMap = null;
let travelMarkers = [];

function loadMapLibrary() {
  if (window.L) {
    initializeTravelMap();
    return;
  }

  if (document.getElementById("leaflet-script")) {
    const waitForLibrary = setInterval(() => {
      if (window.L) {
        clearInterval(waitForLibrary);
        initializeTravelMap();
      }
    }, 300);

    setTimeout(() => clearInterval(waitForLibrary), 15000);
    return;
  }

  const css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
  document.head.appendChild(css);

  const script = document.createElement("script");
  script.id = "leaflet-script";
  script.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";

  script.onload = initializeTravelMap;
  script.onerror = () => {
    mapElement.innerHTML =
      "地图加载失败，请检查网络连接后刷新页面。";
  };

  document.body.appendChild(script);
}

function initializeTravelMap() {
  if (!window.L || travelMap || !mapElement) return;

  travelMap = L.map("map").setView([25, 10], 2);

  L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap"
    }
  ).addTo(travelMap);

  renderTravelMap();
}

function renderTravelMap() {
  if (!travelMap) return;

  travelMarkers.forEach((marker) => marker.remove());
  travelMarkers = [];

  getFilteredPlaces().forEach((place) => {
    const marker = L.marker([place.lat, place.lng]).addTo(travelMap);

    marker.bindPopup(
      "<strong>" + escapeHTML(place.name) + "</strong><br>" +
      escapeHTML(place.country) + "<br>" +
      escapeHTML(place.desc)
    );

    travelMarkers.push(marker);
  });
}

const oldRenderCards = renderCards;

renderCards = function () {
  oldRenderCards();

  if (travelMap) {
    renderTravelMap();
  }
};

loadMapLibrary();
</script>
<!-- PART 5 END -->
